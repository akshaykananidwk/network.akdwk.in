# The vhost a customer's panel gets.
#
# AllowOverride All, because the application's hardening lives in .htaccess and
# an install where it is not read is an install whose configuration file is on
# the web. DocumentRoot is the repository root: there is no public/.
<VirtualHost *:80>
    DocumentRoot /var/www/app

    <Directory /var/www/app>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.2-fpm.sock|fcgi://localhost"
    </FilesMatch>

    ErrorLog /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined
    LogLevel warn
</VirtualHost>
