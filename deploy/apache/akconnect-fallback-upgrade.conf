# AK Connect — the HTTPS fallback, proxied to the relay on this machine.
#
# Some customer networks pass nothing but the port a browser uses. A hotel, a
# guest VLAN, an office firewall that lets UDP out and drops the replies: on
# those the whole UDP design is unavailable, coordinator included, and a device
# there cannot even ask for help. So the agent opens an ordinary TLS connection
# to 443 and carries both its control messages and its relayed tunnel traffic
# over it.
#
# 443 on this server is already Apache, serving the panel. Rather than move
# anything, Apache proxies one path to the relay, which listens on loopback and
# speaks websocket.
#
# This is the mod_proxy_http form, for Apache 2.4.47 and later, where
# mod_proxy_http carries the websocket upgrade itself. mod_proxy_wstunnel is
# deprecated from that version. install-edge.sh writes akconnect-fallback.conf
# instead on anything older. Nothing here is wrapped in <IfModule>: a missing
# module has to be an error somebody sees, and the one thing worse than a
# fallback that will not start is one that silently does nothing.
#
# Written by install-edge.sh and kept current by upgrade-edge.sh. Both are
# idempotent; edit the relay's own --ws-listen if you move it.

# The health probe first: ProxyPass matches in the order the directives appear,
# so the longer path has to be above the one it starts with or it would be
# swallowed by it. Opening it in a browser is the quickest way to find out
# whether a customer's network reaches our 443 at all.
ProxyPass        /fallback/health  http://127.0.0.1:9443/ws/health retry=0
ProxyPassReverse /fallback/health  http://127.0.0.1:9443/ws/health

# timeout is this worker's idle timeout, set here because ProxyTimeout
# otherwise inherits the server's Timeout — and a panel vhost that has shortened
# it for good reasons would quietly cut every tunnel at that age. The relay
# pings every 25 seconds and the agent sends a keepalive every 20, so anything
# above a minute is only there to survive a stalled mobile link.
ProxyPass        /fallback  http://127.0.0.1:9443/ws retry=0 timeout=120 upgrade=websocket
ProxyPassReverse /fallback  http://127.0.0.1:9443/ws

# The relay is told the customer's address through the forwarded header
# mod_proxy adds, and reports it back to the agent — which is what lets a
# technician see the address a site is seen as without asking anybody to visit
# a what-is-my-ip page.
ProxyPreserveHost On
